[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "gaudi3-scale"
version = "0.1.0"
description = "Training utilities for Intel Gaudi 3 HPU at scale — trainer, batch sampler, and LR scaler"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["gaudi", "hpu", "intel", "training", "deep-learning", "large-scale"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# No hard runtime dependencies — pure Python
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.scripts]
gaudi3-demo = "demo:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["gaudi3_scale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py39"
